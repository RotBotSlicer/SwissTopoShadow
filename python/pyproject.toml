[project]
name = "schatten"
version = "0.1.0"
description = "Schattenwurf durch Gelände aus swisstopo-Höhenmodellen (Referenzkern)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyproj", "rasterio"]

[project.optional-dependencies]
test = ["pytest", "pvlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schatten"]
