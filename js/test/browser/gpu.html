<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GPU-Test</title>
<script type="importmap">{ "imports": { "geotiff": "../../../web/vendor/geotiff.js" } }</script>
</head><body><pre id="out">läuft…</pre>
<script type="module">
// Vergleicht die WebGL-Schattenberechnung mit der CPU-Referenz (litDirect).
import { Raster, Terrain } from '../../src/raster.js';
import { litDirect } from '../../src/horizon.js';
import { ShadowRenderer } from '../../src/gpu.js';
import { Pyramid } from '../../src/tiles.js';
import { loadTerrainLod, LOD_DEFAULT, LOD_10M, LOD_40M, withSurface } from '../../src/loaders.js';
import { sunPositionLv95, sunPositionLv95Grad } from '../../src/sun.js';

const results = [];
const log = s => { results.push(s); document.getElementById('out').textContent = results.map(r => JSON.stringify(r)).join('\n'); };
const agree = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] === b[i]; return s / a.length; };

async function synthetic() {
  const f = await (await fetch('../fixtures/horizon_syn.json')).json();
  const levels = await Promise.all(f.levels.map(async (m, i) => {
    const b = await (await fetch(`../fixtures/syn_level${i}.f32`)).arrayBuffer();
    return { raster: new Raster(new Float32Array(b), m.w, m.h, m.x0, m.y0, m.res), until: m.until ?? Infinity };
  }));
  const terrain = new Terrain(levels);
  const gr = new ShadowRenderer(document.createElement('canvas'));
  gr.setTerrain(terrain, { E: f.E0, N: f.N0 });
  const grid = { x0: f.E0 - 1000, y0: f.N0 + 1000, res: 10, w: 200, h: 200 };
  gr.setGrid(grid);
  const opts = { eye: 1.0, rMax: 2800, growth: 0.01 };
  for (const [el, az] of [[5, 120], [12, 150], [20, 181], [8, 233], [3, 95], [30, 200], [-3, 180]]) {
    const t = performance.now();
    const g = gr.litMask(az, el, opts);
    const ms = performance.now() - t;
    const c = litDirect(terrain, grid, el, az, opts);
    log({ test: 'synthetisch', el, az, agree: agree(g, c), lit: c.reduce((a, b) => a + b, 0) / c.length, gpu_ms: Math.round(ms) });
  }
  // Sonnenstunden: GPU-Summe vs. CPU-Summe von litDirect
  const small = { x0: f.E0 - 500, y0: f.N0 + 500, res: 25, w: 40, h: 40 };
  gr.setGrid(small);
  const suns = []; for (let k = 0; k < 60; k++) suns.push({ az: 100 + k * 2.6, el: 2 + 25 * Math.sin(Math.PI * k / 59) });
  const gh = gr.sunHours(suns, 10, opts);
  const ch = new Float32Array(small.w * small.h);
  for (const s of suns) { const m = litDirect(terrain, small, s.el, s.az, opts); m.forEach((v, i) => { ch[i] += v * 10 / 60; }); }
  let d = 0; gh.forEach((v, i) => { d = Math.max(d, Math.abs(v - ch[i])); });
  log({ test: 'sonnenstunden', maxdiff_h: d });
}

async function real() {
  const E = 2719286, N = 1203098;
  const pyr = await Pyramid.open('../../../data/pyramid');
  const area = [E - 500, N - 500, E + 500, N + 500];
  const terrain = await loadTerrainLod(area, pyr, { rMax: 30000 });
  const gr = new ShadowRenderer(document.createElement('canvas'));
  gr.setTerrain(terrain, { E, N });
  const grid = { x0: E - 500, y0: N + 500, res: 10, w: 100, h: 100 };
  gr.setGrid(grid);
  for (const hhmm of ['09:00', '10:30', '12:30', '14:30']) {
    const u = Date.parse(`2026-11-14T${hhmm}:00+01:00`) / 1000;
    const { az, el } = sunPositionLv95(u, E, N);
    const t = performance.now();
    const g = gr.litMask(az, el, { rMax: 30000 });
    const ms = performance.now() - t;
    const c = litDirect(terrain, grid, el, az, { rMax: 30000 });
    log({ test: 'bösbächi', hhmm, agree: agree(g, c), lit: c.reduce((a, b) => a + b, 0) / c.length, gpu_ms: Math.round(ms) });
  }
  // Laufzeit für einen grossen Ausschnitt (wie in der App)
  const big = { x0: E - 500, y0: N + 500, res: 2, w: 500, h: 500 };
  gr.setGrid(big);
  const u = Date.parse('2026-11-14T12:30:00+01:00') / 1000, s = sunPositionLv95(u, E, N);
  gr.litMask(s.az, s.el, { rMax: 30000 });
  const t = performance.now(); gr.litMask(s.az, s.el, { rMax: 30000 });
  log({ test: 'laufzeit 500x500', gpu_ms: Math.round(performance.now() - t) });
}

// Wie stark ändert sich der Schatten, wenn das feinste Gelände gröber wird? (Referenz: 2 m)
async function lodCompare() {
  const E = 2719286, N = 1203098, half = 1500;
  const pyr = await Pyramid.open('../../../data/pyramid');
  const area = [E - half, N - half, E + half, N + half];
  const masks = {};
  for (const [name, lod] of [['2m', LOD_DEFAULT], ['10m', LOD_10M], ['40m', LOD_40M]]) {
    const terrain = await loadTerrainLod(area, pyr, { rMax: 30000, lod });
    for (const px of [10, 40]) {
      const gr = new ShadowRenderer(document.createElement('canvas'));
      gr.setTerrain(terrain, { E, N });
      gr.setGrid({ x0: E - half, y0: N + half, res: px, w: 2 * half / px, h: 2 * half / px });
      for (const hhmm of ['09:30', '11:00', '12:30', '14:30', '15:30']) {
        const u = Date.parse(`2026-11-14T${hhmm}:00+01:00`) / 1000;
        const { az, el } = sunPositionLv95(u, E, N);
        masks[`${name}|${px}|${hhmm}`] = gr.litMask(az, el, { rMax: 30000 });
      }
    }
  }
  for (const px of [10, 40]) for (const name of ['10m', '40m']) {
    let s = 0, n = 0, worst = 1;
    for (const hhmm of ['09:30', '11:00', '12:30', '14:30', '15:30']) {
      const a = masks[`2m|${px}|${hhmm}`], b = masks[`${name}|${px}|${hhmm}`];
      const ag = agree(a, b); worst = Math.min(worst, ag); s += ag * a.length; n += a.length;
    }
    log({ test: 'lod-vergleich', pixel_m: px, gelaende: name, gleich_mittel: +(s / n).toFixed(4), gleich_min: +worst.toFixed(4) });
  }
}

// Grosser Ausschnitt (40 km, 40-m-Gelände): GPU mit Sonnen-Gradient vs. CPU mit exakter Sonne je Pixel
async function bigArea() {
  const E = 2719286, N = 1203098, half = 20000, px = 1000;
  const pyr = await Pyramid.open('../../../data/pyramid');
  const terrain = await loadTerrainLod([E - half, N - half, E + half, N + half], pyr, { rMax: 30000, lod: LOD_40M });
  const gr = new ShadowRenderer(document.createElement('canvas'));
  gr.setTerrain(terrain, { E, N });
  const grid = { x0: E - half, y0: N + half, res: px, w: 2 * half / px, h: 2 * half / px };
  gr.setGrid(grid);
  for (const hhmm of ['08:30', '12:30', '16:00']) {
    const u = Date.parse(`2026-11-14T${hhmm}:00+01:00`) / 1000;
    const s = sunPositionLv95Grad(u, E, N);
    const g = gr.litMask(s.az, s.el, { rMax: 30000, grad: s.grad });
    const g0 = gr.litMask(s.az, s.el, { rMax: 30000 });
    const c = new Uint8Array(grid.w * grid.h);
    for (let i = 0; i < c.length; i++) {
      const r = Math.floor(i / grid.w), col = i % grid.w;
      const pe = grid.x0 + (col + 0.5) * px, pn = grid.y0 - (r + 0.5) * px, t = sunPositionLv95(u, pe, pn);
      c[i] = litDirect(terrain, { x0: pe - px / 2, y0: pn + px / 2, res: px, w: 1, h: 1 }, t.el, t.az, { rMax: 30000 })[0];
    }
    log({ test: 'gross-gradient', hhmm, agree: agree(g, c), ohne_gradient: agree(g0, c) });
  }
}

// Mit Wald/Gebäude: GPU vs. CPU, und wie viel Fläche zusätzlich im Schatten liegt
async function surfaceReal() {
  const E = 2719286, N = 1203098, half = 500, px = 4;
  const pyr = await Pyramid.open('../../../data/pyramid');
  const area = [E - half, N - half, E + half, N + half];
  const tS = await loadTerrainLod(area, pyr, { rMax: 30000, lod: withSurface(LOD_DEFAULT) });
  const t0 = await loadTerrainLod(area, pyr, { rMax: 30000 });
  const grid = { x0: E - half, y0: N + half, res: px, w: 2 * half / px, h: 2 * half / px };
  const gS = new ShadowRenderer(document.createElement('canvas')); gS.setTerrain(tS, { E, N }); gS.setGrid(grid);
  const g0 = new ShadowRenderer(document.createElement('canvas')); g0.setTerrain(t0, { E, N }); g0.setGrid(grid);
  const frac = m => m.reduce((a, b) => a + b, 0) / m.length;
  for (const hhmm of ['10:30', '12:30', '14:30']) {
    const u = Date.parse(`2026-11-14T${hhmm}:00+01:00`) / 1000, { az, el } = sunPositionLv95(u, E, N);
    const a = gS.litMask(az, el, { rMax: 30000 }), c = litDirect(tS, grid, el, az, { rMax: 30000 });
    log({ test: 'oberfläche', hhmm, agree: agree(a, c), besonnt_mit: +frac(a).toFixed(3), besonnt_ohne: +frac(g0.litMask(az, el, { rMax: 30000 })).toFixed(3) });
  }
}

try { await synthetic(); if (location.hash === '#real') { await real(); await surfaceReal(); await bigArea(); await lodCompare(); }
  if (location.hash === '#surface') await surfaceReal(); log('FERTIG'); }
catch (e) { log({ error: String(e.stack || e) }); log('FERTIG'); }
window.__results = results;
</script></body></html>
