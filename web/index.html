<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="app-version" content="__VERSION__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schatten – swisstopo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2712%27 r=%276%27 fill=%27%23e8820c%27/%3E%3Cpath d=%27M0 32 L12 16 L18 23 L23 18 L32 32Z%27 fill=%27%236b7d5c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="./app.css">
<script type="importmap">
{ "imports": { "geotiff": "./vendor/geotiff.js", "tz-lookup": "./vendor/tz-lookup.js" } }
</script>
<script src="./vendor/maplibre/maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>

<!-- Profil (Horizont und Sonnenbahnen) oben über der Karte, unabhängig vom Menü -->
<div id="profile" hidden>
  <div class="phead"><span id="psum"></span><button id="pclose" aria-label="Profil ausblenden">×</button></div>
  <svg id="chart" viewBox="0 0 640 230" aria-label="Horizont und Sonnenbahn"></svg>
  <div class="plegend small"><span class="sw sw-day"></span><span id="lg-day">gewählter Tag</span>
    <span class="sw sw-sum"></span><span id="lg-sum">längster Tag</span><span class="sw sw-win"></span><span id="lg-win">kürzester Tag</span><span id="lg-obj"></span></div>
</div>

<!-- Ortssuche -->
<button id="sbtn" aria-label="Ort suchen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
<div id="search" hidden>
  <div class="srow"><input id="sq" type="search" placeholder="Ort, Berg, Hütte, Adresse …" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="Ort suchen">
    <button id="sclose" aria-label="Suche schliessen">×</button></div>
  <ul id="sres" role="listbox"></ul>
  <div id="sinfo" class="small mut"></div>
</div>

<div id="sheet">
  <div class="grip" id="grip"></div>
  <div id="timebox" hidden>
    <div class="bar">
      <button id="play" aria-label="Abspielen">▶</button>
      <input id="time" type="range" min="0" max="1" step="1" value="0" aria-label="Uhrzeit">
      <span id="timelbl" class="tnum">--:--</span>
    </div>
  </div>
  <div class="bar">
    <div class="seg" role="radiogroup" aria-label="Gebiet">
      <button id="reg-ch" role="radio">Schweiz</button><button id="reg-world" role="radio">Weltweit</button>
    </div>
    <div class="seg" id="base-seg" role="radiogroup" aria-label="Hintergrund">
      <button id="base-map" role="radio">Karte</button><button id="base-air" role="radio">Luftbild</button>
    </div>
    <button id="t3d" aria-pressed="false" title="3D-Ansicht">3D</button>
  </div>
  <div id="region-info" class="mut small"></div>
  <div class="bar">
    <input id="date" type="date" aria-label="Datum">
    <button id="today" title="Heute">Heute</button>
    <button id="locate" title="Mein Standort" aria-label="Mein Standort">◎</button>
    <button id="ptoggle" aria-pressed="true" title="Profil ein-/ausblenden">Profil</button>
  </div>

  <div id="area-box">
    <div class="bar">
      <button id="area" class="pri">Schatten für Ausschnitt</button>
      <select id="mode" aria-label="Anzeige">
        <option value="shadow">Schatten</option>
        <option value="hours">Sonnenstunden</option>
      </select>
    </div>
    <label class="check" id="surface-row"><input type="checkbox" id="surface"> Wald und Gebäude <span class="mut small">(swissSURFACE3D, nur bei feinem Gelände)</span></label>
    <div id="world-note" class="mut small" hidden>Weltweit: Copernicus-Höhenmodell 30 m (Oberfläche, Wald grob enthalten) · Karte OpenTopoMap</div>
    <div id="legend" hidden></div>
    <div id="area-status" class="mut small"></div>
  </div>

  <div id="point" hidden>
    <div class="mut" id="where"></div>
    <div class="big" id="summary"></div>
    <div id="ivs"></div>
    <div id="canopy" class="mut small"></div>
  </div>
  <div id="hint" class="mut">Tippe auf die Karte, um die Sonnenzeiten an einem Ort zu sehen.</div>
  <div id="status" class="mut small"></div>
  <div class="foot small mut" id="credits"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
